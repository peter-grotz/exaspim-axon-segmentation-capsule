[project]
name = "exaspim-axon-segmentation"
version = "0.1.0"
description = "TRAILMAP-based axon segmentation and skeletonization for exaSPIM light-sheet data"
readme = "README.md"
authors = [
    { name = "Peter Grotz", email = "199680633+peter-grotz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "connected-components-3d>=3.18",
    "gcsfs>=2025.3",
    "h5py>=3.12",
    "huggingface-hub>=0.30",
    "matplotlib>=3.9",
    "numpy>=2,<3",
    "pydantic>=2.8,<3",
    "requests>=2.32,<3",
    "s3fs>=2025.3",
    "safetensors>=0.5",
    "scikit-image>=0.24",
    "torch>=2.6",
    "typer>=0.12",
    "zarr>=3.1,<4",
]

[project.scripts]
exaspim-axon = "exaspim_axon_segmentation.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "RUF", "D"]
ignore = ["D105", "D107", "RUF001", "RUF002", "RUF003"]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D", "E402", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: requires network access to public S3 / Allen API"]
